appId: dev.dvstrategic.satnica
productName: Satnica
copyright: ""

directories:
  output: dist
  buildResources: build

files:
  - out/**
  - package.json

asar: true

# macOS — glavna ciljna platforma. Paket se mora praviti NA Mac-u
# (ili na macos runneru u CI-ju); electron-builder ne ume dmg sa Windowsa.
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  # Prototip nije potpisan; na tudjem Mac-u se otvara desni klik > Open.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  artifactName: Satnica-${version}-${arch}.dmg

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Satnica-${version}-setup.exe

linux:
  category: Office
  maintainer: DV Strategic <pn@dv-strategic.dev>
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: Satnica-${version}-${arch}.${ext}
